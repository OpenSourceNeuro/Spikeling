site_name: Spikeling Documentation
site_description: A hardware implementation of spiking neurons for neuroscience teaching and outreach
site_url: https://opensourceneuro.github.io/Spikeling
repo_url: https://github.com/OpenSourceNeuro/Spikeling


theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/SpikyLogo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.tracking

  palette:
    # Default: Solarized Dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Optional: Solarized Light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode


markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_signature: true
  - mkdocs-jupyter:
      execute: false
  - mermaid2
  - glightbox
  - git-revision-date-localized:
      fallback_to_build_date: true

