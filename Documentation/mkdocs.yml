    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenSourceNeuro/Spikeling
    - icon: fontawesome/solid/cart-shopping
      link: https://www.opensourceneuro.com/index.php/product/spikeling-v3-2-unit/
