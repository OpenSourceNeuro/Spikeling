name: Short-term plasticity verification

on:
  push:
    paths:
      - 'Firmware/Spikeling_V3/**'
      - 'Software/GUI - PyQt6-PySide6/stp_*.py'
      - 'Software/GUI - PyQt6-PySide6/Graph_Emulator.py'
      - 'Software/GUI - PyQt6-PySide6/Graph_Spikeling.py'
      - 'Software/GUI - PyQt6-PySide6/Main.py'
      - 'Software/GUI - PyQt6-PySide6/tests/test_stp*.py'
      - '.github/workflows/stp-tests.yml'
  pull_request:
    paths:
      - 'Firmware/Spikeling_V3/**'
      - 'Software/GUI - PyQt6-PySide6/stp_*.py'
      - 'Software/GUI - PyQt6-PySide6/Graph_Emulator.py'
      - 'Software/GUI - PyQt6-PySide6/Graph_Spikeling.py'
      - 'Software/GUI - PyQt6-PySide6/Main.py'
      - 'Software/GUI - PyQt6-PySide6/tests/test_stp*.py'
      - '.github/workflows/stp-tests.yml'

jobs:
  mathematical-model-and-parity:
    name: Model, firmware parity, routing and serial buffering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Firmware/Spikeling_V3
            Software/GUI - PyQt6-PySide6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run C++ firmware smoke tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic Firmware/Spikeling_V3/tests/stp_model_smoke.cpp -o /tmp/stp_smoke
          /tmp/stp_smoke
      - name: Syntax-check modified GUI modules and all STP tests
        working-directory: 'Software/GUI - PyQt6-PySide6'
        run: |
          python -m py_compile Main.py Graph_Emulator.py Graph_Spikeling.py stp_controls.py stp_model.py
          python -m compileall -q tests
      - name: Run Python behavioural, C++ parity and emulator integration battery
        working-directory: 'Software/GUI - PyQt6-PySide6'
        run: python -m unittest discover -s tests -p 'test_stp*.py' -v

  gui-controls-and-csv:
    name: Offscreen GUI controls and recording CSV
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      STP_REQUIRE_QT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Firmware/Spikeling_V3
            Software/GUI - PyQt6-PySide6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Qt EGL runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install minimal Qt and CSV integration dependencies
        run: python -m pip install 'PySide6>=6.7,<7' 'numpy>=1.26' 'pandas>=2.0'
      - name: Test real Qt widget callbacks, mocked serial commands and CSV export
        working-directory: 'Software/GUI - PyQt6-PySide6'
        run: |
          python -m unittest -v tests.test_stp_gui_controls tests.test_stp_recording
