name: Validate Big Spiky firmware

on:
  push:
    branches:
      - feature/big-spiky-esp32s3-firmware
    paths:
      - "Firmware/BigSpiky_V1/**"
      - ".github/workflows/big-spiky-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKETCH: Firmware/BigSpiky_V1
      FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PSRAM=disabled
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned core and library
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli version | tee toolchain.txt
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "Adafruit NeoPixel@1.15.5"
          arduino-cli core list | tee -a toolchain.txt
          arduino-cli lib list | grep -F "Adafruit NeoPixel" | tee -a toolchain.txt

      - name: Host functional and timing tests
        shell: bash
        run: |
          set -euo pipefail
          bash "$SKETCH/tests/run_host_tests.sh" /tmp/bigspiky-host-tests 2>&1 | tee host-tests.log

      - name: Compile repository sketch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bigspiky-build
          arduino-cli compile --warnings all --fqbn "$FQBN" \
            --build-path /tmp/bigspiky-build "$SKETCH" 2>&1 | tee firmware-build.log

      - name: Package, extract and recompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging artifacts/clean
          cp -a "$SKETCH" artifacts/staging/BigSpiky_V1
          find artifacts/staging/BigSpiky_V1 -type d -name build -prune -exec rm -rf {} +
          (
            cd artifacts/staging/BigSpiky_V1
            find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          )
          (cd artifacts/staging && zip -q -r ../BigSpiky_V1-validated.zip BigSpiky_V1)
          sha256sum artifacts/BigSpiky_V1-validated.zip | tee artifacts/ZIP.sha256
          unzip -q artifacts/BigSpiky_V1-validated.zip -d artifacts/clean
          mkdir -p /tmp/bigspiky-extracted-build
          arduino-cli compile --warnings all --fqbn "$FQBN" \
            --build-path /tmp/bigspiky-extracted-build artifacts/clean/BigSpiky_V1 \
            2>&1 | tee extracted-build.log
          cp toolchain.txt host-tests.log firmware-build.log extracted-build.log artifacts/
          cp artifacts/staging/BigSpiky_V1/MANIFEST.sha256 artifacts/

      - name: Upload validated deliverables
        uses: actions/upload-artifact@v4
        with:
          name: BigSpiky_V1-validated-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

