name: Build and Release Spikeling GUI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:          # manual dry runs, no tag required

permissions:
  contents: write

env:
  GUI_DIR: "Software/GUI - PyQt6-PySide6"
  PYTHON_VERSION: "3.12"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-uploaded release

jobs:
  # ---------------------------------------------------------------------
  # Draft release, created once so the three build jobs have a target.
  # Skipped on workflow_dispatch: a dispatch run has no tag to attach to.
  # ---------------------------------------------------------------------
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  # ---------------------------------------------------------------------
  # One job per platform, run concurrently.
  # ---------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: [create-release]
    # `always()` is required because create-release is *skipped* on dispatch
    # runs, and a skipped dependency would otherwise skip this job too.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false        # a Windows failure must not hide a Linux one
      matrix:
        include:
          - os: macos-latest
            label: macOS
            spec: Spikeling-mac.spec
            binary: Spikeling
          - os: ubuntu-latest
            label: Linux
            spec: Spikeling-linux.spec
            binary: Spikeling
          - os: windows-latest
            label: Windows
            spec: Spikeling-win.spec
            binary: Spikeling.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash           # one dialect on all three runners
        working-directory: ${{ env.GUI_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true           # harmless if LFS is unused
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir PySide6==6.9.2 pyinstaller==6.15
          pip install --no-cache-dir numpy==2.3.2 scipy==1.16.1 pandas==2.3.2 \
                                     pyqtgraph==0.13.7 pyserial==3.5

      # Fails the build when an asset was never committed, rather than
      # shipping a binary that silently falls back to placeholder graphics.
      - name: Verify assets are present in the checkout
        run: |
          set -euo pipefail
          test -d resources || { echo "::error::resources/ is missing"; exit 1; }
          for sprite in Spiky1.png Spiky2.png Spiky3.png; do
            test -f "resources/$sprite" || { echo "::error::resources/$sprite is missing"; exit 1; }
          done
          frames=$(find resources/geci -name 'frame_*.png' | wc -l | tr -d ' ')
          echo "GECI turntable frames: $frames"
          [ "$frames" -gt 0 ] || { echo "::error::no turntable frames committed"; exit 1; }
          # Guard against Git LFS pointer files being shipped instead of PNGs.
          if head -c 40 "resources/Spiky1.png" | grep -q 'git-lfs'; then
            echo "::error::LFS pointer checked out, not the image"; exit 1
          fi

      - name: Build with PyInstaller
        run: pyinstaller --clean --log-level=INFO "${{ matrix.spec }}"

      # The CArchive table of contents stores entry names as plain bytes, so a
      # substring scan is version-independent, unlike the reader API.
      - name: Verify assets landed inside the binary
        env:
          BINARY: dist/${{ matrix.binary }}
        run: |
          python - <<'PY'
          import os, pathlib, sys
          blob = pathlib.Path(os.environ["BINARY"]).read_bytes()
          missing = [n for n in (b"resources/geci", b"Spiky1.png") if n not in blob]
          size_mb = len(blob) / 1e6
          print(f"binary: {size_mb:.1f} MB")
          if missing:
              sys.exit(f"::error::not embedded: {[m.decode() for m in missing]}")
          print("asset entries confirmed in bundle")
          PY

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          rm -rf release out && mkdir -p release out
          cp "dist/${{ matrix.binary }}" release/
          chmod +x "release/${{ matrix.binary }}" || true
          cp -r Recordings Neurons Stimuli release/
          python -c "import shutil,sys; shutil.make_archive(sys.argv[1],'zip','release')" \
                 "out/Spikeling-${version}-${{ matrix.label }}"
          ls -lh out/

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ env.GUI_DIR }}/out/Spikeling-${{ github.ref_name }}-${{ matrix.label }}.zip

      - name: Upload dry-run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Spikeling-${{ matrix.label }}-dryrun
          path: ${{ env.GUI_DIR }}/out/*.zip
          retention-days: 7

  # ---------------------------------------------------------------------
  # Only now does the release become visible to users.
  # ---------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Flip draft to published
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
