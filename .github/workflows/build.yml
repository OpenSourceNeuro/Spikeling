name: Build and Release Spikeling GUI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # allow creating/updating releases

env:
  GUI_DIR: "Software/GUI - PyQt6-PySide6"

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ${{ env.GUI_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir PySide6==6.9.2 pyinstaller==6.15
          pip install --no-cache-dir numpy==2.3.2 scipy==1.16.1 pandas==2.3.2 pyqtgraph==0.13.7 pyserial==3.5

      # Fails in seconds if a theming source was never committed, instead of
      # producing an application whose Settings page silently does nothing.
      - name: Verify theming sources are present
        working-directory: ${{ env.GUI_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in Main.py theme_manager.py Page_Settings.py \
                   Page_Spikeling_DataAnalysis.py Parameters_Sliders.py \
                   Parameters_ToggleButtons.py Spikeling-mac.spec; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required source file is missing from ${{ env.GUI_DIR }}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required sources present."

      - name: Build with PyInstaller
        working-directory: ${{ env.GUI_DIR }}
        run: pyinstaller --clean --log-level=DEBUG Spikeling-mac.spec

      # Lists every module PyInstaller could not resolve. Uploaded here, before
      # the Cleanup step removes build/, and on failure too since that is
      # exactly when the report is needed.
      - name: Upload PyInstaller warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-warnings-${{ runner.os }}
          path: ${{ env.GUI_DIR }}/build/Spikeling/warn-Spikeling.txt
          if-no-files-found: ignore

      - name: Package macOS build
        run: |
          version="${GITHUB_REF_NAME}"
          zipName="Spikeling-${version}-macOS.zip"

          mkdir -p release
          cp "${{ env.GUI_DIR }}/dist/Spikeling" release/
          chmod +x release/Spikeling
          cp -r "${{ env.GUI_DIR }}/Recordings" release/
          cp -r "${{ env.GUI_DIR }}/Neurons" release/
          cp -r "${{ env.GUI_DIR }}/Stimuli" release/

          zip -r "$zipName" release/*
          mkdir -p "${{ env.GUI_DIR }}/macOS"
          mv "$zipName" "${{ env.GUI_DIR }}/macOS/"
          rm -rf release

      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.GUI_DIR }}/macOS/Spikeling-${{ github.ref_name }}-macOS.zip

      - name: Cleanup
        run: rm -rf "${{ env.GUI_DIR }}/build" "${{ env.GUI_DIR }}/dist" "${{ env.GUI_DIR }}/__pycache__"

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ${{ env.GUI_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir PySide6==6.9.2 pyinstaller==6.15
          pip install --no-cache-dir numpy==2.3.2 scipy==1.16.1 pandas==2.3.2 pyqtgraph==0.13.7 pyserial==3.5

      # Fails in seconds if a theming source was never committed, instead of
      # producing an application whose Settings page silently does nothing.
      - name: Verify theming sources are present
        working-directory: ${{ env.GUI_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in Main.py theme_manager.py Page_Settings.py \
                   Page_Spikeling_DataAnalysis.py Parameters_Sliders.py \
                   Parameters_ToggleButtons.py Spikeling-linux.spec; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required source file is missing from ${{ env.GUI_DIR }}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required sources present."

      - name: Build with PyInstaller
        working-directory: ${{ env.GUI_DIR }}
        run: pyinstaller --clean --log-level=DEBUG Spikeling-linux.spec

      # Lists every module PyInstaller could not resolve. Uploaded here, before
      # the Cleanup step removes build/, and on failure too since that is
      # exactly when the report is needed.
      - name: Upload PyInstaller warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-warnings-${{ runner.os }}
          path: ${{ env.GUI_DIR }}/build/Spikeling/warn-Spikeling.txt
          if-no-files-found: ignore

      - name: Package Linux build
        run: |
          version="${GITHUB_REF_NAME}"
          zipName="Spikeling-${version}-Linux.zip"

          mkdir -p release
          cp "${{ env.GUI_DIR }}/dist/Spikeling" release/
          chmod +x release/Spikeling
          cp -r "${{ env.GUI_DIR }}/Recordings" release/
          cp -r "${{ env.GUI_DIR }}/Neurons" release/
          cp -r "${{ env.GUI_DIR }}/Stimuli" release/

          zip -r "$zipName" release/*
          mkdir -p "${{ env.GUI_DIR }}/Linux"
          mv "$zipName" "${{ env.GUI_DIR }}/Linux/"
          rm -rf release

      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.GUI_DIR }}/Linux/Spikeling-${{ github.ref_name }}-Linux.zip

      - name: Cleanup
        run: rm -rf "${{ env.GUI_DIR }}/build" "${{ env.GUI_DIR }}/dist" "${{ env.GUI_DIR }}/__pycache__"

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    needs: build-linux

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ${{ env.GUI_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir PySide6==6.9.2 pyinstaller==6.15
          pip install --no-cache-dir numpy==2.3.2 scipy==1.16.1 pandas==2.3.2 pyqtgraph==0.13.7 pyserial==3.5

      # Runs under Git Bash, which ships with windows-latest, so this check is
      # byte-identical to the macOS and Linux jobs and cannot drift from them.
      - name: Verify theming sources are present
        working-directory: ${{ env.GUI_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in Main.py theme_manager.py Page_Settings.py \
                   Page_Spikeling_DataAnalysis.py Parameters_Sliders.py \
                   Parameters_ToggleButtons.py Spikeling-win.spec; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required source file is missing from ${{ env.GUI_DIR }}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required sources present."

      - name: Build with PyInstaller
        working-directory: ${{ env.GUI_DIR }}
        run: pyinstaller --clean --log-level=DEBUG Spikeling-win.spec

      # Lists every module PyInstaller could not resolve. Uploaded here, before
      # the Cleanup step removes build/, and on failure too since that is
      # exactly when the report is needed.
      - name: Upload PyInstaller warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-warnings-${{ runner.os }}
          path: ${{ env.GUI_DIR }}/build/Spikeling/warn-Spikeling.txt
          if-no-files-found: ignore

      - name: Package Windows build
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "Spikeling-$version-Windows.zip"

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path "${{ env.GUI_DIR }}/dist/Spikeling.exe" -Destination release/
          Copy-Item -Path "${{ env.GUI_DIR }}/Recordings" -Destination release/ -Recurse
          Copy-Item -Path "${{ env.GUI_DIR }}/Neurons" -Destination release/ -Recurse
          Copy-Item -Path "${{ env.GUI_DIR }}/Stimuli" -Destination release/ -Recurse

          New-Item -ItemType Directory -Force -Path "${{ env.GUI_DIR }}/Windows" | Out-Null
          Compress-Archive -Path "release\*" -DestinationPath "${{ env.GUI_DIR }}/Windows/$zipName" -Force

          Remove-Item -Recurse -Force release

      - name: Upload Windows artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.GUI_DIR }}/Windows/Spikeling-${{ github.ref_name }}-Windows.zip

      - name: Cleanup
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "${{ env.GUI_DIR }}/build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ env.GUI_DIR }}/dist" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ env.GUI_DIR }}/__pycache__" -ErrorAction SilentlyContinue
