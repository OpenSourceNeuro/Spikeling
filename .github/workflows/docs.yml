name: Deploy MkDocs site

on:
  push:
    branches:
      - main
    # The GECI turntables are tens of MB of PNG that no page renders.
    # Without this filter every asset commit triggers a full docs rebuild.
    paths:
      - "Documentation/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: mkdocs-git-revision-date-localized reads `git log`
          # per page. A shallow clone yields the build date for every file,
          # which the plugin reports as a warning and --strict turns fatal.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs-material \
            mkdocs-jupyter \
            mkdocstrings[python] \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-mermaid2-plugin \
            mkdocs-glightbox

      - name: Build site (mkdocs.yml is in Documentation/)
        working-directory: Documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
